name: Package v1.9.0 sign-draft ZIP EXE - CP950-safe (no CI tests)
on:
  push:
    branches: [feature/v1.9.0-zip-sign-draft]
    paths: ['.github/workflows/windows-build.yml']
permissions:
  contents: read
jobs:
  package-only:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Build standalone Windows x64 EXE (no tests)
        shell: pwsh
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o '公文PDF快合.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'EXE compilation failed' }
      - name: Embed original icon
        shell: pwsh
        run: ./ci-embed-icon.ps1
      - name: Embed Surveying Division version and attribution
        shell: pwsh
        run: ./ci-embed-attribution.ps1
      - name: Embed Common Controls v6 manifest
        shell: pwsh
        run: ./ci-embed-manifest.ps1
      - name: Verify version metadata and report SHA256 (no tests)
        shell: pwsh
        run: |
          $info=[System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path '公文PDF快合.exe').Path)
          if ($info.FileVersion -ne '1.9.0.0') { throw 'Expected v1.9.0 VERSIONINFO' }
          Get-FileHash -Algorithm SHA256 '公文PDF快合.exe' | Format-List
      - name: Upload EXE for acceptance
        uses: actions/upload-artifact@v4
        with:
          name: OfficialPDFMerge-v1.9.0-sign-draft-win64
          path: 公文PDF快合.exe
          if-no-files-found: error
          retention-days: 14
