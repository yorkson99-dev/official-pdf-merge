name: Publish image-enabled release v1.8.0 (no rebuild or CI tests)
on:
  push:
    branches: [feature/v1.6.1-office2-images]
    paths: ['.github/workflows/windows-build.yml']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download previously tested Windows EXE artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41573499212 --repo "$env:GITHUB_REPOSITORY" --name "OfficialPDFMerge-office2-images-win64" --dir "release-binary"
          if ($LASTEXITCODE -ne 0) { throw 'Approved EXE artifact download failed' }
          Copy-Item -LiteralPath "release-binary/公文PDF快合.exe" -Destination "公文PDF快合.exe"
      - name: Update only Windows VERSIONINFO to v1.8.0
        shell: pwsh
        run: |
          ./ci-embed-attribution.ps1
          $info=[System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path '公文PDF快合.exe').Path)
          if ($info.FileVersion -ne '1.8.0.0' -or $info.ProductVersion -ne '1.8.0.0') { throw "Version mismatch: $($info.FileVersion)/$($info.ProductVersion)" }
          if ($info.CompanyName -ne '臺北市政府地政局測繪科') { throw 'Developer attribution changed' }
          Copy-Item -LiteralPath '公文PDF快合.exe' -Destination 'OfficialPDFMerge.exe'
          Get-FileHash -Algorithm SHA256 'OfficialPDFMerge.exe' | Format-List
      - name: Publish v1.8.0 GitHub Release with EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.8.0 "OfficialPDFMerge.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "公文 PDF 快合 v1.8.0（常見圖片格式合併支援）" --notes-file "RELEASE_NOTES_v1.8.0.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
