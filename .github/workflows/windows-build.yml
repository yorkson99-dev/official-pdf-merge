name: Build standalone Win32 EXE
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand initial source archive (one time)
        shell: pwsh
        run: |
          if (Test-Path 'bootstrap/source.00.txt') {
            $parts = @(0..3 | ForEach-Object { (Get-Content -Raw ("bootstrap/source.0$_.txt")).Trim() })
            $archive = [Convert]::FromBase64String(($parts -join ''))
            [System.IO.File]::WriteAllBytes('source.tar.xz', $archive)
            $actual = (Get-FileHash -Algorithm SHA256 'source.tar.xz').Hash.ToLowerInvariant()
            $expected = '89c95abd939323be533968a9efcd146f65233b342536e70a4f059a5e0088cd6e'
            if ($actual -ne $expected) { throw "Source archive integrity mismatch: $actual" }
            tar -xJf source.tar.xz
            if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
            Remove-Item source.tar.xz
          }
      - name: Install Go on GitHub hosted runner only
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Unit tests
        run: go test ./...
      - name: Verify exclusive NDC ODF conversion backend
        shell: pwsh
        run: |
          $source = (Get-Content -Raw office_windows.go) + (Get-Content -Raw ndc_windows.go)
          if ($source -notmatch 'soffice[.]com') { throw 'NDC ODF executable not configured' }
          if ($source -match 'Word[.]Application|Excel[.]Application|PowerPoint[.]Application|powershell[.]exe') {
            throw 'Legacy Office COM or PowerShell conversion path detected'
          }
          Write-Output 'PASS: NDC ODF is the only bundled Office/ODF converter'
      - name: NDC ODF argument and mocked batch conversion tests
        shell: pwsh
        run: go test -run TestNDC -v .
      - name: Build single Windows x64 GUI executable
        shell: pwsh
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o '公文PDF快合.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Go build failed' }
      - name: Embed native application icon
        shell: pwsh
        run: ./ci-embed-icon.ps1
      - name: Build diagnostic console executable (CI only)
        shell: pwsh
        run: go build -trimpath -o debug-console.exe .
      - name: GUI startup smoke test (real Windows desktop)
        shell: pwsh
        run: ./ci-startup-smoke.ps1
      - name: ZIP auto-merge and post-merge UI responsiveness test
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Output "ZIP/UI E2E iteration $_/3"
            ./ci-zip-e2e.ps1
          }
      - name: Manual PDF reorder/remove/clear integration test
        shell: pwsh
        run: ./ci-pdf-manual-e2e.ps1
      - name: Direct-to-EXE drop auto-merge and no-Save-As integration test
        shell: pwsh
        run: ./ci-auto-drop-e2e.ps1
      - name: Manual sorted merge auto-save and optional Save As integration test
        shell: pwsh
        run: ./ci-manual-autosave-e2e.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: OfficialPDFMerge-win64
          path: 公文PDF快合.exe
          if-no-files-found: error
      - name: Publish portable EXE release v1.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item -LiteralPath "公文PDF快合.exe" -Destination "OfficialPDFMerge.exe" -Force
          gh release view v1.7.0 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.7.0 "OfficialPDFMerge.exe" --clobber
          } else {
            gh release create v1.7.0 "OfficialPDFMerge.exe" --target main --title "公文 PDF 快合 v1.7.0" --notes "離線 NDC ODF 轉檔版：直接呼叫已安裝 NDC ODF 3.3.3 的 soffice.com，以隔離設定檔和單次批次處理可編輯附件；移除 Microsoft Office COM 與 PowerShell。保留公文 ZIP 一鍵合併、排序、命名、記憶體 PDF 合併與資料安全驗證。Apex One 偵測仍須另行實測。" --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release upload failed" }
      - name: Check in extracted source files and remove bootstrap archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if (Test-Path 'bootstrap/source.00.txt') {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .gitignore go.mod main_windows.go cli.go lettertext.go pdfmerge.go zipmerge.go pdfmerge_test.go zipmerge_test.go testdata/sample0.pdf
            git rm -r -- bootstrap
            git commit -m 'feat: publish native Win32 PDF merger source and tests'
            if ($LASTEXITCODE -ne 0) { throw 'Git commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Git push failed' }
          }
