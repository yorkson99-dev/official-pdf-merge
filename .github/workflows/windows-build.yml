name: Package image-enabled Windows EXE
on:
  push:
    branches: [feature/v1.6.1-office2-images]
    paths: ['.github/workflows/windows-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-only:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Build Windows portable GUI EXE (no CI tests)
        shell: pwsh
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o '公文PDF快合.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'EXE compilation failed' }
      - name: Embed icon
        shell: pwsh
        run: ./ci-embed-icon.ps1
      - name: Embed developer attribution
        shell: pwsh
        run: ./ci-embed-attribution.ps1
      - name: Embed Common Controls v6 manifest
        shell: pwsh
        run: ./ci-embed-manifest.ps1
      - name: Record EXE SHA-256
        shell: pwsh
        run: Get-FileHash -Algorithm SHA256 '公文PDF快合.exe'
      - name: Upload EXE for manual acceptance
        uses: actions/upload-artifact@v4
        with:
          name: OfficialPDFMerge-office2-images-win64
          path: 公文PDF快合.exe
          if-no-files-found: error
          retention-days: 14
