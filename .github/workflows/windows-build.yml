name: Build standalone Win32 EXE
on:
  push:
    branches: [maintenance/v1.6.1-mixed-warning]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand initial source archive (one time)
        shell: pwsh
        run: |
          if (Test-Path 'bootstrap/source.00.txt') {
            $parts = @(0..3 | ForEach-Object { (Get-Content -Raw ("bootstrap/source.0$_.txt")).Trim() })
            $archive = [Convert]::FromBase64String(($parts -join ''))
            [System.IO.File]::WriteAllBytes('source.tar.xz', $archive)
            $actual = (Get-FileHash -Algorithm SHA256 'source.tar.xz').Hash.ToLowerInvariant()
            $expected = '89c95abd939323be533968a9efcd146f65233b342536e70a4f059a5e0088cd6e'
            if ($actual -ne $expected) { throw "Source archive integrity mismatch: $actual" }
            tar -xJf source.tar.xz
            if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
            Remove-Item source.tar.xz
          }
      - name: Install Go on GitHub hosted runner only
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Unit tests
        run: go test ./...
      - name: Verify no shell-based Office conversion path
        shell: pwsh
        run: |
          $source = (Get-Content -Raw office_windows.go) + (Get-Content -Raw office_com_windows.go)
          if ($source -match 'powershell[.]exe|soffice[.]exe|exec[.]Command|os/exec|cmd[.]exe') {
            throw 'Office conversion unexpectedly launches a shell or external document converter'
          }
          Write-Output 'PASS: conversion uses native COM only'
      - name: Exercise COM IDispatch ABI on hosted Windows runner
        shell: pwsh
        run: go test -run TestNativeCOMDispatchOnWindows -v .
      - name: Build single Windows x64 GUI executable
        shell: pwsh
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o '公文PDF快合.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Go build failed' }
      - name: Embed native application icon
        shell: pwsh
        run: ./ci-embed-icon.ps1
      - name: Embed Surveying Division developer attribution
        shell: pwsh
        run: ./ci-embed-attribution.ps1
      - name: Verify developer attribution and toggle resource
        shell: pwsh
        run: |
          $source=Get-Content -Raw -Encoding UTF8 main_windows.go
          if ($source -notmatch '臺北市政府地政局測繪科開發') { throw 'Missing UI developer attribution' }
          if ($source -notmatch 'ID_MIXED_WARNING') { throw 'Missing warning toggle' }
          if ($source -notmatch 'MB_DEFBUTTON2') { throw 'Risk dialog must default to stop' }
          $v=[System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path '公文PDF快合.exe').Path)
          if ($v.CompanyName -ne '臺北市政府地政局測繪科') {throw 'Metadata CompanyName mismatch'}
          if ($v.Comments -ne '臺北市政府地政局測繪科開發') {throw 'Metadata Comments mismatch'}
          Write-Output 'PASS: developer credit, guarded user interaction, native EXE metadata'
      - name: Build diagnostic console executable (CI only)
        shell: pwsh
        run: go build -trimpath -o debug-console.exe .
      - name: GUI startup smoke test (real Windows desktop)
        shell: pwsh
        run: ./ci-startup-smoke.ps1
      - name: ZIP auto-merge and post-merge UI responsiveness test
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Output "ZIP/UI E2E iteration $_/3"
            ./ci-zip-e2e.ps1
          }
      - name: Manual PDF reorder/remove/clear integration test
        shell: pwsh
        run: ./ci-pdf-manual-e2e.ps1
      - name: Direct-to-EXE drop auto-merge and no-Save-As integration test
        shell: pwsh
        run: ./ci-auto-drop-e2e.ps1
      - name: Manual sorted merge auto-save and optional Save As integration test
        shell: pwsh
        run: ./ci-manual-autosave-e2e.ps1
      - name: End-to-end safety prompt and persistent warning checkbox
        shell: pwsh
        run: ./ci-warning-e2e.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: OfficialPDFMerge-win64
          path: 公文PDF快合.exe
          if-no-files-found: error
      - name: Publish portable EXE release v1.6.1 warning and attribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/maintenance/v1.6.1-mixed-warning' && contains(github.event.head_commit.message, 'release-v1.6.1-warning')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item -LiteralPath "公文PDF快合.exe" -Destination "OfficialPDFMerge.exe" -Force
          gh release create v1.6.1-warning "OfficialPDFMerge.exe" --target maintenance/v1.6.1-mixed-warning --title "公文 PDF 快合 v1.6.1（混合多檔慎用警告＋測繪科署名）" --notes "完全以 v1.6.1 的 Microsoft Office COM 和 PDF 解析架構為基底。僅在實際合併檔案>3且含非PDF時，預設提示是否繼續（預設停止），可在主畫面關閉提醒並用HKCU記憶。純PDF合併不警示。EXE與GUI標註臺北市政府地政局測繪科開發。EXE仍未簽章，安全警告不能保證避免Apex One攔截。" --latest=false
          if ($LASTEXITCODE -ne 0) {throw 'Version release failed'}
